name: Build IPA Ad-Hoc Solar2D (Fix iostemplate Local)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Máquina Apple Silicon M1/M2 super rápida do GitHub

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Forçar Xcode 15.2 Compatível
        run: |
          sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer
          xcode-select -p
          xcrun --sdk iphoneos --show-sdk-path

      - name: Instalar Certificado Nativamente via Apple Security
        run: |
          # 1. Configura variáveis e cria caminhos absolutos para o Keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          PASSWORD="github_actions_password"
          
          echo "Criando e configurando Keychain temporário..."
          security create-keychain -p "$PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$PASSWORD" "$KEYCHAIN_PATH"
          
          # 2. FIX CRUCIAL: Adiciona o chaveiro customizado na lista de busca do macOS
          # Sem isso, o utilitário 'codesign' da Apple nunca encontrará o certificado importado
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          
          # 3. Importa o certificado .p12 para dentro do chaveiro liberando acesso ao codesign
          echo "Importando certificado digital .p12..."
          security import ./distribution.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "${{ secrets.P12_PASSWORD }}" \
            -f pkcs12 \
            -t agg \
            -T /usr/bin/codesign \
            -T /usr/bin/codesign_allocate
          
          # 4. Configura partições de segurança para evitar janelas pop-up pedindo senha no CI
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$PASSWORD" "$KEYCHAIN_PATH"
          
          echo "Certificados atualmente instalados e visíveis no sistema:"
          security find-identity -v -p codesigning

      - name: Baixar o Código Fonte (.zip)
        run: |
          # Adicione o link do seu ZIP entre as aspas abaixo:
          curl -L -o projeto.zip "https://abuzznewasset.b-cdn.net/aquaticnewwithoutoutput.zip"

      - name: Extrair Código Fonte e Corrigir Raiz do main.lua
        run: |
          mkdir -p codigo_extraido
          
          # Extrai qualquer arquivo .zip presente na raiz do seu repositorio
          unzip -o *.zip -d codigo_extraido/
          
          # TRUQUE DEFINITIVO: Se o ZIP criou uma pasta interna, trazemos os arquivos para a raiz
          # Isso impede o "Build script failed" por falta de arquivos estruturais do jogo
          cd codigo_extraido
          if [ ! -f main.lua ]; then
            echo "main.lua nao encontrado na raiz. Buscando em subpastas..."
            SUBPASTA=$(find . -name "main.lua" -maxdepth 3 | head -n 1 | sed 's|/main.lua||')
            if [ ! -z "$SUBPASTA" ]; then
              echo "Movendo arquivos de $SUBPASTA para a raiz..."
              mv "$SUBPASTA"/* . 2>/dev/null || true
            fi
          fi
          
          echo "Conteudo final da pasta de compilaçao:"
          ls -la
          cd ..

      - name: Injetar iostemplate e Compilar IPA Offline
        run: |
          # 1. Garante que as pastas de destino existam limpas
          rm -rf build
          mkdir -p build
          
          # 2. Captura caminhos absolutos fundamentais
          RAIZ_PROJETO=$(pwd)
          PASTA_SIMULADOR="$RAIZ_PROJETO/Corona.2026.3731/Corona-3731/Corona Simulator.app/Contents/Resources/iostemplate"
          PASTA_BUILDER="$RAIZ_PROJETO/Corona.2026.3731/Corona-3731/Native/Corona/mac/bin/CoronaBuilder.app/Contents/Resources"
          TARGET_BUILDER="$RAIZ_PROJETO/Corona.2026.3731/Corona-3731/Native/Corona/mac/bin/CoronaBuilder.app/Contents/MacOS/CoronaBuilder"
          
          # 3. Alimenta a pasta de templates interna do CoronaBuilder
          mkdir -p "$PASTA_BUILDER/templates"
          cp "$PASTA_SIMULADOR/iphoneos_17.2.tar.bz" "$PASTA_BUILDER/templates/"
          
          # 4. TRUQUE DE SEGURANÇA: Remove de forma agressiva os bits de quarentena do macOS (Gatekeeper)
          # O macOS bloqueia scripts internos do Solar2D silenciosamente se notar que vieram da internet
          echo "Limpando quarentena profunda do SDK do Solar2D..."
          sudo xattr -rd com.apple.quarantine "$RAIZ_PROJETO/Corona.2026.3731" || true
          chmod -R +x "$RAIZ_PROJETO/Corona.2026.3731" || true
          
          # 5. Captura variáveis de ambiente do Xcode exigidas pelo empacotador
          XCODE_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          export SDKROOT="$XCODE_SDK_PATH"
          
          # 6. TRUQUE ANTIFALHA DE PLUGINS: Desativa plugins incompatíveis com o modo offline no build.settings
          # Se o seu jogo usa plugins de anúncios/redes, o builder offline quebra. Removemos eles dinamicamente aqui:
          if [ -f "codigo_extraido/build.settings" ]; then
            echo "Ajustando build.settings para compilação offline pura..."
            sed -i '' '/plugins *=/,/}/d' codigo_extraido/build.settings || true
          fi
          
          # 7. GERAR CONFIG_PARAM COM SINTAXE DE PROPRIEDADE LIMPA
          cat << 'EOF' > build_ios.lua
          return {
              appName = "Alphabets & Numbers",
              platform = "ios",
              appVersion = "2.0.0",
              projectPath = "codigo_extraido",
              certificatePath = "distribution.mobileprovision",
              dstPath = "build"
          }
          EOF

          echo "Validando arquivo final build_ios.lua:"
          cat build_ios.lua
          
          # 8. EXECUÇÃO DO CORONABUILDER
          echo "Iniciando compilação nativa..."
          "$TARGET_BUILDER" build --lua build_ios.lua







      - name: Modificar Bundle ID e Re-assinar Binário .APP (Ad-Hoc)
        run: |
          # Altere o Bundle ID abaixo para bater com o seu Ad-Hoc cadastrado na Apple:
          NOVO_BUNDLE_ID="com.iabuzz.ios.ConnectTheDotsAquatic"
          
          # CAPTURA DINÂMICA: Localiza qualquer pasta .app gerada dentro do diretorio build
          APP_PATH=$(find build -name "*.app" -maxdepth 1 | head -n 1)
          
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "ERRO FATAL: Nao foi encontrado nenhum arquivo .app na pasta build!"
            ls -la build
            exit 1
          fi
          
          echo "Pasta identificada para processamento: $APP_PATH"
          
          echo "Injetando o novo Bundle ID no Info.plist..."
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $NOVO_BUNDLE_ID" "$APP_PATH/Info.plist"
          
          echo "Injetando o arquivo de provisionamento Ad-Hoc..."
          cp ./distribution.mobileprovision "$APP_PATH/embedded.mobileprovision"
          
          echo "Extraindo autorizações de assinatura (Entitlements)..."
          security cms -D -i ./distribution.mobileprovision > $RUNNER_TEMP/profile.plist
          /usr/libexec/PlistBuddy -x -c 'Print :Entitlements' $RUNNER_TEMP/profile.plist > $RUNNER_TEMP/entitlements.plist
          
          echo "Aplicando nova assinatura digital forcada..."
          /usr/bin/codesign --force --sign "iPhone Distribution" --entitlements $RUNNER_TEMP/entitlements.plist "$APP_PATH"

      - name: Compactar e Transformar em Estrutura .IPA Final
        run: |
          # Localiza dinamicamente a pasta .app novamente para garantir a rota
          APP_PATH=$(find build -name "*.app" -maxdepth 1 | head -n 1)
          
          mkdir -p ipa_output/Payload
          cp -R "$APP_PATH" ipa_output/Payload/
          
          cd ipa_output
          zip -r ../build/App.ipa Payload
          cd ..

      - name: Coletar Arquivo IPA Gerado
        uses: actions/upload-artifact@v4
        with:
          name: Kitchen Puzzle 4 Kids
          path: build/*.ipa
          if-no-files-found: error
